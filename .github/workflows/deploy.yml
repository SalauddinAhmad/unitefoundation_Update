name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. FRONTEND — React build → /public_html/
  # ────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SITE_URL: https://unitefoundation.bd

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy frontend via lftp
        env:
          FTP_HOST: ftp.unitefoundation.bd
          FTP_USER: deploy@unitefoundation.bd
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            set net:timeout 20;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set ftp:passive-mode on;
            set ftp:use-feat no;
            open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST;
            mirror -R --parallel=2 --verbose \
              --exclude-glob .git* \
              --exclude-glob node_modules/ \
              --exclude-glob .htaccess \
              ./dist/ /;
          "

  # ────────────────────────────────────────────────────────────
  # 2. BACKEND — server/ → /api-app/
  # ────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare backend package
        run: |
          mkdir -p out
          rsync -a --exclude 'node_modules' --exclude '.env' --exclude 'uploads' server/ out/
          mkdir -p out/tmp
          date > out/tmp/restart.txt

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy backend via lftp
        env:
          FTP_HOST: ftp.unitefoundation.bd
          FTP_USER: deploy@unitefoundation.bd
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            set net:timeout 20;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set ftp:passive-mode on;
            set ftp:use-feat no;
            open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST;
            mkdir -p -f /api-app;
            mirror -R --parallel=2 --verbose \
              --exclude-glob .git* \
              --exclude-glob node_modules/ \
              --exclude-glob .env \
              --exclude-glob uploads/ \
              ./out/ /api-app/;
          "
