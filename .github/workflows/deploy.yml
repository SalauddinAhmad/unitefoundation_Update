name: Deploy to cPanel

on:
  # Auto-deploy on push is DISABLED — deploy runs only when you click
  # "Run workflow" from the GitHub Actions tab.
  # To re-enable auto-deploy, uncomment the push block below.
  #
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'কী deploy করবেন?'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - frontend
          - backend

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. FRONTEND — React build → /public_html/
  # ────────────────────────────────────────────────────────────
  frontend:
    if: ${{ github.event.inputs.target == 'frontend' || github.event.inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SITE_URL: https://unitefoundation.bd

      - name: Deploy frontend via cPanel API
        env:
          CPANEL_HOST: cpanel.unitefoundation.bd
          CPANEL_PORT: '2083'
          CPANEL_USER: unitefound
          CPANEL_HOME: /home/unitefound
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: bash scripts/deploy-cpanel-zip.sh dist public_html

  # ────────────────────────────────────────────────────────────
  # 2. BACKEND — server/ → /public_html/api-app/
  # ────────────────────────────────────────────────────────────
  backend:
    if: ${{ github.event.inputs.target == 'backend' || github.event.inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare backend package
        run: |
          mkdir -p out
          rsync -a --exclude 'node_modules' --exclude '.env' --exclude 'uploads' server/ out/
          mkdir -p out/tmp
          date > out/tmp/restart.txt

      - name: Deploy backend via cPanel API
        env:
          CPANEL_HOST: cpanel.unitefoundation.bd
          CPANEL_PORT: '2083'
          CPANEL_USER: unitefound
          CPANEL_HOME: /home/unitefound
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: bash scripts/deploy-cpanel-zip.sh out public_html/api-app
