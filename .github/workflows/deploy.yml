name: Deploy to cPanel

on:
  # Auto-deploy on push is DISABLED — deploy runs only when you click
  # "Run workflow" from the GitHub Actions tab.
  # To re-enable auto-deploy, uncomment the push block below.
  #
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'কী deploy করবেন?'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - frontend
          - backend
      method:
        description: 'কোন পদ্ধতিতে? (Imunify360 ব্লক করলে ftps বা ssh নিন)'
        required: true
        default: 'ftps'
        type: choice
        options:
          - ftps
          - ssh
          - api

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. FRONTEND — React build → /public_html/
  # ────────────────────────────────────────────────────────────
  frontend:
    if: ${{ github.event.inputs.target == 'frontend' || github.event.inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SITE_URL: https://unitefoundation.bd

      - name: Deploy frontend via FTPS
        if: ${{ github.event.inputs.method == 'ftps' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: bash scripts/deploy-ftps.sh dist public_html

      - name: Deploy frontend via SSH
        if: ${{ github.event.inputs.method == 'ssh' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash scripts/deploy-ssh.sh dist public_html

      - name: Deploy frontend via cPanel API
        if: ${{ github.event.inputs.method == 'api' }}
        env:
          CPANEL_HOST: cpanel.unitefoundation.bd
          CPANEL_ORIGIN_IP: 14.128.14.142
          CPANEL_PORT: '2083'
          CPANEL_USER: unitefound
          CPANEL_HOME: /home/unitefound
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: bash scripts/deploy-cpanel-zip.sh dist public_html

  # ────────────────────────────────────────────────────────────
  # 2. BACKEND — server/ → /public_html/api-app/
  # ────────────────────────────────────────────────────────────
  backend:
    if: ${{ github.event.inputs.target == 'backend' || github.event.inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare backend package
        run: |
          mkdir -p out
          rsync -a --exclude 'node_modules' --exclude '.env' --exclude 'uploads' server/ out/
          mkdir -p out/tmp
          date > out/tmp/restart.txt
          printf '%s' '${{ github.sha }}' > out/DEPLOY_RELEASE

      - name: Deploy backend via FTPS
        if: ${{ github.event.inputs.method == 'ftps' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: bash scripts/deploy-ftps.sh out public_html/api-app

      - name: Deploy backend via SSH
        if: ${{ github.event.inputs.method == 'ssh' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash scripts/deploy-ssh.sh out public_html/api-app

      - name: Deploy backend via cPanel API
        if: ${{ github.event.inputs.method == 'api' }}
        env:
          CPANEL_HOST: cpanel.unitefoundation.bd
          CPANEL_ORIGIN_IP: 14.128.14.142
          CPANEL_PORT: '2083'
          CPANEL_USER: unitefound
          CPANEL_HOME: /home/unitefound
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: bash scripts/deploy-cpanel-zip.sh out public_html/api-app

      - name: Verify live backend deployment
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          for i in $(seq 1 24); do
            BODY="$(curl -sS --max-time 15 https://api.unitefoundation.bd/health/deploy || true)"
            if printf '%s' "$BODY" | grep -Fq "$EXPECTED_RELEASE"; then
              echo "✅ Live backend is running release $EXPECTED_RELEASE"
              exit 0
            fi
            echo "Waiting for Passenger restart ($i/24)..."
            sleep 5
          done
          echo "❌ Files uploaded, but the live backend is not running this release."
          echo "Check the FTP account root/path and restart the app in cPanel Setup Node.js App."
          exit 1
