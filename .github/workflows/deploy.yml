name: Deploy to cPanel

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - frontend
          - backend
      method:
        description: 'Deployment method'
        required: true
        default: 'ftps'
        type: choice
        options:
          - ftps
          - ssh
          - api

jobs:
  frontend:
    if: ${{ github.ref == 'refs/heads/main' && ((github.event.inputs.target || 'both') == 'frontend' || (github.event.inputs.target || 'both') == 'both') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SITE_URL: https://unitefoundation.bd

      - name: Stamp release
        run: printf '%s' '${{ github.sha }}' > dist/release.txt



      - name: Deploy frontend via FTPS
        if: ${{ (github.event.inputs.method || 'ftps') == 'ftps' }}
        env:
          # Always deploy to the current cPanel origin. The old FTP hostname can
          # still resolve to the previous server and produce a false success.
          FTP_HOST: 14.128.14.142
          FTP_EXPECTED_IP: 14.128.14.142
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          # Optional but recommended: exact path from cPanel → Domains →
          # unitefoundation.bd → Document Root (relative to this FTP login).
          FTP_FRONTEND_ROOT: ${{ secrets.FTP_FRONTEND_ROOT }}
          BACKEND_REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
          # The deploy script writes a unique probe into candidate FTP roots
          # and continues only when that exact probe is visible on the origin.
          DEPLOY_VERIFY_URL: https://unitefoundation.bd
          DEPLOY_ORIGIN_IP: 14.128.14.142
        # The production bundle contains hundreds of chunks. cPanel FTPS can
        # take more than five minutes even while it is still uploading normally.
        timeout-minutes: 15
        run: bash scripts/deploy-ftps.sh dist public_html

      - name: Deploy frontend via SSH
        if: ${{ (github.event.inputs.method || 'ftps') == 'ssh' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BACKEND_REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: bash scripts/deploy-ssh.sh dist public_html

      - name: Deploy frontend via cPanel API
        if: ${{ (github.event.inputs.method || 'ftps') == 'api' }}
        env:
          CPANEL_HOST: cpanel.unitefoundation.bd
          CPANEL_ORIGIN_IP: 14.128.14.142
          CPANEL_PORT: '2083'
          CPANEL_USER: unitefound
          CPANEL_HOME: /home/unitefound
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          BACKEND_REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: bash scripts/deploy-cpanel-zip.sh dist public_html

      - name: Verify frontend is live
        env:
          ORIGIN_IP: 14.128.14.142
        run: |
          for i in $(seq 1 12); do
            LIVE=$(curl -fsS --max-time 20 \
              --resolve "unitefoundation.bd:443:${ORIGIN_IP}" \
              -H 'Cache-Control: no-cache' \
              "https://unitefoundation.bd/release.txt?cb=$RANDOM" | head -c 60 || true)
            echo "attempt $i -> '$LIVE'"
            if [ "$LIVE" = "${{ github.sha }}" ]; then
              echo "✅ Frontend live with this commit"; exit 0
            fi
            sleep 10
          done
          echo "❌ New release was not found on the actual web origin."
          echo "   The upload reached a different FTP root/server than unitefoundation.bd."
          exit 1



  backend:
    if: ${{ github.ref == 'refs/heads/main' && ((github.event.inputs.target || 'both') == 'backend' || (github.event.inputs.target || 'both') == 'both') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare backend package
        run: |
          mkdir -p out
          rsync -a --exclude 'node_modules' --exclude '.env' --exclude 'uploads' server/ out/
          mkdir -p out/tmp
          date > out/tmp/restart.txt
          printf '%s' '${{ github.sha }}' > out/DEPLOY_RELEASE

      - name: Deploy backend via FTPS
        if: ${{ (github.event.inputs.method || 'ftps') == 'ftps' }}
        env:
          FTP_HOST: 14.128.14.142
          FTP_EXPECTED_IP: 14.128.14.142
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          BACKEND_REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        timeout-minutes: 10
        run: bash scripts/deploy-ftps.sh out "${BACKEND_REMOTE_PATH:-public_html/api-app}"

      - name: Deploy backend via SSH
        if: ${{ (github.event.inputs.method || 'ftps') == 'ssh' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BACKEND_REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: bash scripts/deploy-ssh.sh out "${BACKEND_REMOTE_PATH:-public_html/api-app}"

      - name: Deploy backend via cPanel API
        if: ${{ (github.event.inputs.method || 'ftps') == 'api' }}
        env:
          CPANEL_HOST: cpanel.unitefoundation.bd
          CPANEL_ORIGIN_IP: 14.128.14.142
          CPANEL_PORT: '2083'
          CPANEL_USER: unitefound
          CPANEL_HOME: /home/unitefound
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          BACKEND_REMOTE_PATH: ${{ secrets.BACKEND_REMOTE_PATH }}
        run: bash scripts/deploy-cpanel-zip.sh out "${BACKEND_REMOTE_PATH:-public_html/api-app}"

      - name: Verify backend is live
        env:
          ORIGIN_IP: 14.128.14.142
        run: |
          for i in $(seq 1 12); do
            RESPONSE=$(curl -fsS --max-time 20 \
              --resolve "api.unitefoundation.bd:443:${ORIGIN_IP}" \
              -H 'Cache-Control: no-cache' \
              "https://api.unitefoundation.bd/health/deploy?cb=$RANDOM" || true)
            LIVE=$(printf '%s' "$RESPONSE" | python3 -c \
              'import json,sys; d=json.load(sys.stdin); print(d.get("release", ""))' 2>/dev/null || true)
            echo "attempt $i -> release '$LIVE'"
            if [ "$LIVE" = "${{ github.sha }}" ]; then
              echo "✅ Backend live with this commit"; exit 0
            fi
            sleep 10
          done
          echo "❌ Backend health endpoint is not serving this commit." >&2
          echo "   Check the Node.js Application Root, BACKEND_REMOTE_PATH, and Passenger restart." >&2
          exit 1
